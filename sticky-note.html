<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: transparent;
    font-family: system-ui, sans-serif;
  }
  body.dock { background: #1e2023; }
  body.overlay { pointer-events: none; }
  body.overlay .toolbar,
  body.overlay .add-row,
  body.overlay .controls { display: none !important; }

  /* ---------- Dock toolbar ---------- */
  .toolbar {
    padding: 8px 12px 10px;
    font-family: system-ui, sans-serif;
  }
  .toolbar-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .toolbar-row + .toolbar-row { margin-top: 8px; }
  .tweaks { justify-content: flex-start; column-gap: 14px; row-gap: 6px; }
  .tweak {
    display: flex;
    align-items: center;
    gap: 5px;
    font: 11px system-ui, sans-serif;
    color: #9a9fa6;
  }
  .tweak input[type="range"] { width: 84px; accent-color: #8a93a0; }
  .tweak input[type="color"] {
    width: 26px; height: 20px;
    border: 1px solid #44484e;
    border-radius: 4px;
    background: none;
    padding: 1px;
    cursor: pointer;
  }
  .tweak .val {
    min-width: 34px;
    color: #7d838b;
    font-variant-numeric: tabular-nums;
  }
  .swatches { display: flex; gap: 6px; flex-wrap: wrap; }
  .swatch {
    width: 22px; height: 22px;
    border: 1px solid rgba(255,255,255,.3);
    border-radius: 5px;
    cursor: pointer;
    padding: 0;
    position: relative;
  }
  .swatch.selected { outline: 2px solid #fff; outline-offset: 1px; }
  /* a pasted theme gets a corner tick so it reads as yours, not a built-in */
  .swatch.custom::after {
    content: "";
    position: absolute;
    right: -1px; bottom: -1px;
    border: 5px solid transparent;
    border-right-color: rgba(255,255,255,.75);
    border-bottom-color: rgba(255,255,255,.75);
  }
  .toolbar-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .toolbar-actions button {
    font: 12px system-ui, sans-serif;
    color: #cfd2d6;
    background: #33373c;
    border: 1px solid #44484e;
    border-radius: 6px;
    padding: 5px 10px;
    cursor: pointer;
  }
  .toolbar-actions button:hover { background: #3d4147; }
  .toolbar-actions button.armed { background: #7a2e2e; border-color: #9c4040; color: #fff; }

  /* ---------- Theme panel (dock) ---------- */
  .theme-panel { margin-top: 9px; }
  .theme-panel-hint { font: 11px system-ui, sans-serif; color: #8d9299; line-height: 1.4; }
  .theme-panel textarea {
    display: block;
    width: 100%;
    height: 54px;
    margin-top: 6px;
    resize: vertical;
    font: 11px ui-monospace, Menlo, monospace;
    color: #c8ccd2;
    background: #2a2d31;
    border: 1px solid #3a3e44;
    border-radius: 5px;
    padding: 5px 7px;
  }
  .theme-panel textarea:focus { outline: none; border-color: #5a6068; }
  .theme-panel-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 6px;
  }
  .theme-panel-actions button {
    font: 11px system-ui, sans-serif;
    color: #cfd2d6;
    background: #33373c;
    border: 1px solid #44484e;
    border-radius: 5px;
    padding: 4px 9px;
    cursor: pointer;
  }
  .theme-panel-actions button:hover { background: #3d4147; }
  .theme-builder { margin-top: 10px; border-top: 1px solid #2f3439; padding-top: 8px; }
  .theme-builder .url-label { color: #8d9299; }
  .theme-msg { font: 11px system-ui, sans-serif; color: #8d9299; }
  .theme-msg.bad { color: #e08585; }
  .theme-msg.good { color: #7fc08a; }

  /* ---------- Note ----------
     Everything below is token-driven. There is no per-theme CSS anywhere in
     this file: a theme sets custom properties and data-* attributes (see
     theme.js) and the rules here read them. Adding a theme means adding data,
     never a selector. */
  /* Block + auto margins rather than flex centring: when the note is wider
     than the pane, `justify-content: center` would push its left edge out of
     reach, while auto margins collapse to zero and leave it scrollable. */
  #note-wrap { padding: 24px 12px; }
  #note-wrap > .note { margin-left: auto; margin-right: auto; }
  /* An OBS dock pane is often narrower than the note. Without this the fixed
     width of the note sets the width of the whole page, and the toolbar lays
     itself out against that phantom width — leaving its buttons rendered
     outside the visible pane with no way to scroll to them. */
  body.dock #note-wrap { overflow-x: auto; }

  .note {
    position: relative;
    width: var(--note-width, 380px);
    padding: var(--pad-y, 24px) var(--pad-x, 26px) var(--pad-bottom, 16px) var(--pad-left, 26px);
    color: var(--ink);
    font-family: var(--font);
    text-shadow: var(--text-shadow, none);
    transform: rotate(var(--rot, -2deg));
    border: var(--border-w, 0) solid var(--border-c, transparent);
    border-radius: var(--note-radius, 2px);
    box-shadow: var(--shadow, 0 8px 18px rgba(0,0,0,.28), 0 2px 4px rgba(0,0,0,.18));

    /* Two texture slots plus the paper gradient, always three layers so the
       size/position/repeat lists stay aligned whatever the texture is. An
       unused slot is `none`, which still occupies its slot. */
    background-color: var(--paper);
    background-image:
      var(--tex-1, none),
      var(--tex-2, none),
      linear-gradient(var(--paper-angle, 160deg), var(--paper), var(--paper2));
    background-size:     var(--tex-1-size, auto), var(--tex-2-size, auto), auto;
    background-position: var(--tex-1-pos, 0 0),  var(--tex-2-pos, 0 0),  0 0;
    background-repeat:   var(--tex-1-rep, repeat), var(--tex-2-rep, repeat), no-repeat;
    background-origin: border-box;
  }

  .note[data-celebrate="on"].celebrate { animation: wiggle .6s ease-in-out; }
  @keyframes wiggle {
    0%   { transform: rotate(var(--rot, -2deg)); }
    25%  { transform: rotate(calc(var(--rot, -2deg) + 2.6deg)); }
    50%  { transform: rotate(calc(var(--rot, -2deg) - 1.6deg)); }
    75%  { transform: rotate(calc(var(--rot, -2deg) + 1deg)); }
    100% { transform: rotate(var(--rot, -2deg)); }
  }

  /* ---------- Texture ---------- */
  .note[data-texture="ruled"] {
    /* the margin rule sits just inside the extra left padding the theme asks
       for, so it lands where a real notepad puts it however wide the pad is */
    --tex-1: linear-gradient(90deg,
      transparent 0 calc(var(--pad-left) - 13px),
      var(--tex-b) calc(var(--pad-left) - 13px) calc(var(--pad-left) - 11px),
      transparent 0);
    --tex-1-rep: no-repeat;
    --tex-2: repeating-linear-gradient(180deg,
      transparent 0 calc(var(--tex-gap) - 1px),
      var(--tex-a) calc(var(--tex-gap) - 1px) var(--tex-gap));
  }
  .note[data-texture="grid"] {
    --tex-1: repeating-linear-gradient(180deg,
      transparent 0 calc(var(--tex-gap) - 1px), var(--tex-a) calc(var(--tex-gap) - 1px) var(--tex-gap));
    --tex-2: repeating-linear-gradient(90deg,
      transparent 0 calc(var(--tex-gap) - 1px), var(--tex-a) calc(var(--tex-gap) - 1px) var(--tex-gap));
  }
  .note[data-texture="dots"] {
    --tex-1: radial-gradient(var(--tex-a) 1px, transparent 1.6px);
    --tex-1-size: 7px 7px;
    --tex-2: radial-gradient(var(--tex-b) 1px, transparent 1.6px);
    --tex-2-size: 11px 11px;
    --tex-2-pos: 3px 5px;
  }
  .note[data-texture="scanlines"] {
    --tex-1: repeating-linear-gradient(180deg,
      var(--tex-a) 0 1px, transparent 1px var(--tex-gap));
  }
  .note[data-texture="grain"] {
    --tex-1: radial-gradient(var(--tex-a) .5px, transparent .8px);
    --tex-1-size: 3px 3px;
    --tex-2: radial-gradient(var(--tex-b) .5px, transparent .8px);
    --tex-2-size: 5px 4px;
    --tex-2-pos: 1px 2px;
  }

  /* ---------- Frame accents ----------
     Corner brackets and edge rules, on their own element rather than as more
     background slots on .note: the layer count varies with how many corners
     and edges are selected, which would wreck the alignment of the texture
     lists. The lists themselves are generated in theme.js, so this rule does
     not care whether it is drawing one corner or a full border. */
  .note-frame {
    position: absolute;
    inset: calc(var(--border-w, 0px) * -1 + var(--frame-inset, 0px));
    pointer-events: none;
    z-index: 2;
    background-image: var(--frame-img, none);
    background-size: var(--frame-size, auto);
    background-position: var(--frame-pos, 0 0);
    background-repeat: no-repeat;
  }

  /* ---------- Folded corner ---------- */
  .note::after {
    content: "";
    position: absolute;
    width: var(--corner-size, 32px);
    height: var(--corner-size, 32px);
  }
  .note[data-corner="none"]::after { display: none; }

  /* which corner it sits in, and which way the fold faces */
  .note[data-corner-at="br"]::after { right: 0; bottom: 0; --corner-dir: to top left; }
  .note[data-corner-at="bl"]::after { left: 0;  bottom: 0; --corner-dir: to top right; }
  .note[data-corner-at="tr"]::after { right: 0; top: 0;    --corner-dir: to bottom left; }
  .note[data-corner-at="tl"]::after { left: 0;  top: 0;    --corner-dir: to bottom right; }

  /* lifted: the paper eases back into itself, so the corner looks peeled */
  .note[data-corner="fold"]::after {
    background: linear-gradient(var(--corner-dir),
      transparent 47%, var(--curl) 50%, var(--curl) 60%, var(--paper) 85%);
  }
  /* turned down: a flat triangle of the sheet's back */
  .note[data-corner="dogear"]::after {
    background: linear-gradient(var(--corner-dir), var(--curl) 0 50%, transparent 50%);
  }
  /* peeled: same triangle, rounded and casting a shadow back onto the note */
  .note[data-corner="curl"]::after {
    background: linear-gradient(var(--corner-dir), var(--curl) 0 50%, transparent 50%);
    border-radius: 0 0 0 calc(var(--corner-size, 32px) * .55);
    filter: drop-shadow(-2px -2px 3px rgba(0,0,0,.3));
  }
  /* torn off: the sheet is bitten away along its bottom edge.
     One mask layer, no compositing — the two-layer intersect version needs
     -webkit-mask-composite and mask-composite to agree on semantics they do
     not share, and gets you an invisible note when they disagree. A radial
     gradient that is opaque past its radius scallops the edge on its own. */
  .note[data-corner="torn"] {
    --torn-r: calc(var(--corner-size, 32px) * .28);
    -webkit-mask-image: radial-gradient(circle at 50% 100%,
      transparent 0 var(--torn-r), #000 calc(var(--torn-r) + .5px));
    -webkit-mask-size: calc(var(--torn-r) * 2) 100%;
    -webkit-mask-repeat: repeat-x;
    mask-image: radial-gradient(circle at 50% 100%,
      transparent 0 var(--torn-r), #000 calc(var(--torn-r) + .5px));
    mask-size: calc(var(--torn-r) * 2) 100%;
    mask-repeat: repeat-x;
  }
  /* a mask clips the drop shadow too, so a torn note carries its own edge */
  .note[data-corner="torn"]::after { display: none; }

  /* ---------- Tape / pushpin ---------- */
  .note-pin {
    position: absolute;
    left: 50%;
    pointer-events: none;
    z-index: 3;
  }
  .note[data-pin="none"] .note-pin { display: none; }
  .note[data-pin="tape"] .note-pin {
    top: -11px;
    width: 82px; height: 24px;
    margin-left: -41px;
    background: var(--pin-c);
    transform: rotate(-4deg);
    box-shadow: 0 1px 3px rgba(0,0,0,.25);
  }
  .note[data-pin="pushpin"] .note-pin {
    top: -9px;
    width: 18px; height: 18px;
    margin-left: -9px;
    border-radius: 50%;
    background: radial-gradient(circle at 34% 30%, #fff 0 2px, var(--pin-c) 3px 100%);
    box-shadow: 0 2px 4px rgba(0,0,0,.4);
  }

  /* ---------- Title ---------- */
  .note-title {
    position: relative;
    font-family: var(--title-font, var(--font));
    font-size: var(--title-size, 34px);
    font-weight: var(--title-weight, 700);
    letter-spacing: var(--title-track, 0);
    color: var(--title-c, var(--ink));
    text-shadow: var(--title-glow, var(--text-shadow, none));
    line-height: 1.15;
    margin-bottom: 8px;
    word-break: break-word;
  }
  .note[data-title-case="upper"] .note-title { text-transform: uppercase; }
  .note[data-title-rule="on"] .note-title {
    padding-bottom: 8px;
    margin-bottom: 9px;
    border-bottom: 1px solid var(--border-c, var(--ink-soft));
  }

  [contenteditable]:focus {
    outline: 1px dashed var(--ink-soft);
    outline-offset: 2px;
    border-radius: 2px;
  }

  /* ---------- Tasks ---------- */
  #tasks { list-style: none; position: relative; }
  .task {
    position: relative;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 3px 0;
    transition: opacity .4s ease;
  }

  /* ---------- The item you are on right now ----------
     Marks live in the padding beside the row rather than in the flow, so
     turning one on never reflows the list — the text stays exactly where it
     was, which matters when this is changing live on stream. */
  .task.current .text { font-weight: var(--current-weight, inherit); }
  .note[data-current="none"] .task.current .text { font-weight: inherit; }

  .note[data-current="bar"] .task.current::before,
  .note[data-current="arrow"] .task.current::before,
  .note[data-current="dot"] .task.current::before {
    content: "";
    position: absolute;
    left: -11px;
    color: var(--current-c);
    pointer-events: none;
  }
  .note[data-current="bar"] .task.current::before {
    top: 4px; bottom: 4px;
    width: 3px;
    background: var(--current-c);
    border-radius: 2px;
  }
  .note[data-current="dot"] .task.current::before {
    top: calc(var(--task-line, 32px) * .38);
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--current-c);
  }
  .note[data-current="arrow"] .task.current::before {
    content: "\25B8";
    left: -14px;
    top: calc(var(--task-line, 32px) * .04);
    font: 700 calc(var(--task-size, 26px) * .85)/1 system-ui, sans-serif;
  }
  /* a wash behind the row; sits under the text rather than over it */
  .note[data-current="highlight"] .task.current::before {
    content: "";
    position: absolute;
    left: -8px; right: -8px; top: 1px; bottom: 1px;
    background: var(--current-c);
    opacity: .16;
    border-radius: 4px;
    pointer-events: none;
  }

  .checkbox {
    appearance: none;
    flex: none;
    width: var(--check-size, 22px);
    height: var(--check-size, 22px);
    margin-top: calc(var(--task-line, 32px) * .19);
    background: transparent;
    border: var(--check-stroke, 2px) solid var(--check-c, var(--ink));
    border-radius: 4px;
    position: relative;
    padding: 0;
    transition: background-color .25s ease, border-color .25s ease;
  }
  .note[data-check="sharp"] .checkbox { border-radius: 0; }
  .note[data-check="circle"] .checkbox { border-radius: 50%; }
  .note[data-check="none"] .checkbox { display: none; }
  /* hand-drawn boxes sit askew; a HUD's do not */
  .note[data-jitter="on"] .checkbox { transform: rotate(-1deg); }
  .note[data-jitter="on"] .task:nth-child(even) .checkbox { transform: rotate(1.5deg); }
  .task.done .checkbox { background-color: var(--check-fill-done, transparent); }

  body.dock .checkbox { cursor: pointer; }
  /* Centred on the box and scaled with it, so a tick can deliberately overhang
     a small box — the nudge matches where a tick drawn by hand actually lands,
     high and slightly left of centre. */
  .checkbox svg {
    position: absolute;
    left: 50%; top: 50%;
    width: calc(var(--check-size, 22px) * var(--check-tick-scale, 1.18));
    height: calc(var(--check-size, 22px) * var(--check-tick-scale, 1.18));
    transform: translate(-50%, -50%) translate(-4%, -21%);
    overflow: visible;
  }
  .checkbox .check {
    fill: none;
    stroke: var(--check-tick, var(--check-c, var(--ink)));
    stroke-width: var(--check-tick-w, 3.2);
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 34;
    stroke-dashoffset: 34;
    transition: stroke-dashoffset .3s ease;
  }
  .task.done .check { stroke-dashoffset: 0; }

  .task .text {
    display: block;
    flex: 1;
    font-size: var(--task-size, 26px);
    line-height: var(--task-line, 32px);
    word-break: break-word;
    min-width: 0;
    transition: color .3s ease;
  }
  /* pen strikethrough: gradient sized to the text, cloned per wrapped line */
  .task .txt {
    padding: 0 3px;
    margin-left: -3px;
    background-image: linear-gradient(var(--ink), var(--ink));
    background-repeat: no-repeat;
    background-position: 0 55%;
    background-size: 0% var(--strike-w, 2.5px);
    transition: background-size .45s ease .15s;
    -webkit-box-decoration-break: clone;
    box-decoration-break: clone;
  }

  /* ---------- How a finished task reads ----------
     Struck out, faded, or both — independent, because a note can want the pen
     stroke without the task receding into the paper. */
  .note[data-done-strike="on"] .task.done .txt { background-size: 100% var(--strike-w, 2.5px); }
  .note[data-done-fade="dim"] .task.done { opacity: var(--done-dim, .55); }
  .note[data-done-fade="mute"] .task.done .text { color: var(--done-c, var(--ink-soft)); }

  .controls {
    display: flex;
    gap: 1px;
    margin-left: auto;
    opacity: 0;
    transition: opacity .15s;
  }
  .task:hover .controls { opacity: .9; }
  .controls button {
    font: 13px system-ui, sans-serif;
    color: var(--ink-soft);
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 4px 4px;
  }
  .controls button:hover { color: var(--ink); }

  /* ---------- Add row ---------- */
  .add-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .add-row .plus { font-size: calc(var(--task-size, 26px) * .95); color: var(--ink-soft); }
  .add-row input {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-family: var(--font);
    font-size: calc(var(--task-size, 26px) * .92);
    color: var(--ink);
    background: transparent;
    border: none;
    border-bottom: 1.5px dashed var(--ink-soft);
    padding: 2px 0;
  }
  .add-row input::placeholder { color: var(--ink-soft); }
  .add-row input:focus { outline: none; border-bottom-color: var(--ink); }

  #progress {
    position: relative;
    margin-top: 10px;
    /* clears the folded corner; a note without one gets the space back */
    margin-right: 18px;
    font-size: var(--progress-size, 20px);
    font-weight: var(--progress-weight, 400);
    color: var(--progress-c, var(--ink-soft));
    text-shadow: var(--progress-glow, var(--text-shadow, none));
    font-variant-numeric: tabular-nums;
    text-align: right;
  }
  .note[data-corner="none"] #progress { margin-right: 0; }

  /* ---------- All-done stamp ---------- */
  .stamp {
    position: absolute;
    top: 45%; left: 50%;
    transform: translate(-50%, -50%) rotate(-9deg);
    border: 3px solid var(--accent);
    color: var(--accent);
    padding: 2px 16px;
    font-family: var(--title-font, var(--font));
    font-size: var(--stamp-size, 32px);
    font-weight: 700;
    letter-spacing: var(--stamp-track, 1px);
    border-radius: var(--stamp-radius, 8px);
    pointer-events: none;
    z-index: 4;
  }
  .note[data-title-case="upper"] .stamp { text-transform: uppercase; }
  .stamp.pop { animation: stamp-in .35s ease-out; }
  @keyframes stamp-in {
    0%   { transform: translate(-50%, -50%) rotate(-9deg) scale(2.2); opacity: 0; }
    70%  { transform: translate(-50%, -50%) rotate(-9deg) scale(.95); opacity: 1; }
    100% { transform: translate(-50%, -50%) rotate(-9deg) scale(1); opacity: 1; }
  }

  /* ---------- Font stacks ----------
     Only the first three are embedded. The rest cost nothing to offer because
     they resolve against fonts the machine already has. */
  .note[data-font="hand"]      { --font: 'Caveat', 'Bradley Hand', 'Marker Felt', cursive; }
  .note[data-font="sans"]      { --font: 'Barlow', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
  .note[data-font="condensed"] { --font: 'Barlow Condensed', 'Barlow', 'Arial Narrow', sans-serif; }
  .note[data-font="system"]    { --font: system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .note[data-font="serif"]     { --font: Georgia, 'Iowan Old Style', 'Times New Roman', serif; }
  .note[data-font="mono"]      { --font: ui-monospace, Menlo, Consolas, monospace; }
  .note[data-font="marker"]    { --font: 'Marker Felt', 'Comic Sans MS', 'Segoe Print', cursive; }

  .note[data-title-font="inherit"]   { --title-font: var(--font); }
  .note[data-title-font="hand"]      { --title-font: 'Caveat', 'Bradley Hand', cursive; }
  .note[data-title-font="sans"]      { --title-font: 'Barlow', 'Segoe UI', Arial, sans-serif; }
  .note[data-title-font="condensed"] { --title-font: 'Barlow Condensed', 'Barlow', 'Arial Narrow', sans-serif; }
  .note[data-title-font="system"]    { --title-font: system-ui, -apple-system, sans-serif; }
  .note[data-title-font="serif"]     { --title-font: Georgia, 'Times New Roman', serif; }
  .note[data-title-font="mono"]      { --title-font: ui-monospace, Menlo, monospace; }
  .note[data-title-font="marker"]    { --title-font: 'Marker Felt', 'Comic Sans MS', cursive; }

  /* ---------- Setup-URLs panel (dock footer / browser fallback) ---------- */
  #setup {
    font-family: system-ui, sans-serif;
    pointer-events: auto;
  }
  #setup .setup-title { font-size: 12px; font-weight: 600; margin-bottom: 2px; }
  #setup .setup-hint { font-size: 11px; margin-top: 8px; line-height: 1.4; }
  .url-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .url-label { font-size: 11px; flex: none; width: 48px; }
  .url-text {
    font: 11px ui-monospace, Menlo, monospace;
    padding: 5px 8px;
    border-radius: 5px;
    user-select: all;
    overflow-wrap: anywhere;
    flex: 1;
    /* without this the unbroken file:// URL sets the row's min-content width
       and drags the whole dock wider than the pane OBS gives it */
    min-width: 0;
  }
  .copy-btn {
    font: 11px system-ui, sans-serif;
    border-radius: 5px;
    padding: 4px 8px;
    cursor: pointer;
    flex: none;
  }
  body.dock #setup { margin: 4px 12px 20px; color: #8d9299; }
  body.dock .url-text { background: #2a2d31; border: 1px solid #3a3e44; color: #c8ccd2; }
  body.dock .copy-btn { background: #33373c; border: 1px solid #44484e; color: #cfd2d6; }
  body.dock .copy-btn:hover { background: #3d4147; }
  body.overlay #setup {
    max-width: 460px;
    margin: 0 auto 24px;
    padding: 14px 16px;
    background: #f4f4f6;
    border: 1px solid #d9d9de;
    border-radius: 10px;
    color: #333;
  }
  body.overlay #setup .url-text { background: #fff; border: 1px solid #c9c9cf; color: #222; }
  body.overlay #setup .copy-btn { background: #fff; border: 1px solid #bbb; color: #333; }
  body.overlay #setup .copy-btn:hover { background: #ececf0; }
  body.overlay #setup .setup-hint { color: #666; }

  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="toolbar" id="toolbar" hidden>
    <div class="toolbar-row">
      <div class="swatches" id="swatches"></div>
      <div class="toolbar-actions">
        <button id="theme-btn" type="button">Theme</button>
        <button id="uncheck-all" type="button">Uncheck all</button>
        <button id="clear-list" type="button">Clear list</button>
      </div>
    </div>
    <div class="toolbar-row tweaks">
      <label class="tweak">Size
        <input id="size-slider" type="range" min="50" max="200" step="5">
        <span class="val" id="size-val"></span>
      </label>
      <label class="tweak">Tilt
        <input id="rot-slider" type="range" min="-15" max="15" step="1">
        <span class="val" id="rot-val"></span>
      </label>
      <label class="tweak">Paper
        <input id="paper-color" type="color">
      </label>
      <label class="tweak">Ink
        <input id="ink-color" type="color">
      </label>
    </div>
    <div class="theme-panel" id="theme-panel" hidden>
      <div class="theme-panel-hint">
        Paste a code from the Theme Builder to add a theme, or copy this note's
        theme to share it.
      </div>
      <textarea id="theme-code" spellcheck="false" placeholder="sn1:..."></textarea>
      <div class="theme-panel-actions">
        <button id="theme-apply" type="button">Add theme</button>
        <button id="theme-copy" type="button">Copy current</button>
        <button id="theme-remove" type="button" hidden>Remove</button>
        <span class="theme-msg" id="theme-msg"></span>
      </div>
      <div class="theme-builder" id="theme-builder" hidden>
        <div class="url-row">
          <span class="url-label">Builder</span>
          <span class="url-text" id="builder-url"></span>
          <button type="button" class="copy-btn" id="builder-copy">Copy</button>
        </div>
        <div class="theme-panel-hint" id="builder-hint"></div>
      </div>
    </div>
  </div>

  <div id="note-wrap">
    <div class="note" id="note">
      <div class="note-frame"></div>
      <div class="note-pin"></div>
      <div class="note-title" id="title"></div>
      <ul id="tasks"></ul>
      <div class="add-row" id="add-row" hidden>
        <span class="plus">+</span>
        <input id="add-input" type="text" maxlength="200" placeholder="Add a task, press Enter">
      </div>
      <div id="progress" hidden></div>
      <div class="stamp" id="stamp" hidden>All done!</div>
    </div>
  </div>

  <div id="setup" hidden></div>
<script>
/* ---------------------------------------------------------------------------
 * Theme tokens
 *
 * A theme is plain data. Nothing here knows about a specific built-in, and the
 * built-ins below get no privileges a user's theme doesn't also have — that's
 * the whole point. If a look can't be expressed as a token, the token set is
 * wrong, not the theme.
 *
 * Derived values (soft ink, gradient partner, curl shade) are computed here in
 * JS rather than in CSS. color-mix() and relative color syntax would be tidier
 * but they need a newer Chromium than some shipping OBS builds carry, and a
 * theme that silently loses its colors on someone's older OBS is worse than a
 * few lines of arithmetic. It also means the note and the builder apply themes
 * through exactly the same code path.
 * ------------------------------------------------------------------------- */

var THEME_V = 1;

var DEFAULTS = {
  v: THEME_V,
  id: 'untitled',
  label: 'Untitled',

  /* paper */
  paper: '#feff9c',
  paper2: '',            /* '' → derived as a slightly darker paper */
  paperAngle: 160,
  paperAlpha: 1,
  texture: 'none',       /* none | ruled | grid | dots | scanlines | grain */
  textureColor: '#000000',
  textureColor2: '#ffffff',
  textureAlpha: 0.09,
  textureGap: 32,

  /* ink */
  ink: '#3a3833',
  inkSoftAlpha: 0.5,
  accent: '#d64545',

  /* shape */
  width: 380,
  radius: 2,
  tilt: -2,
  padX: 26,
  padY: 24,
  padLeft: 0,            /* 0 → same as padX */
  padBottom: 16,
  borderWidth: 0,
  borderColor: '#000000',
  borderAlpha: 0.18,
  shadow: 'soft',        /* none | soft | hard | lift */

  /* Corner brackets and edge rules are two selections of the same idea, so
     they are sets rather than an enum of the handful of combinations someone
     thought of first. Empty means no accent at all. */
  frameCorners: '',      /* any of: tl tr bl br */
  frameEdges: '',        /* any of: t r b l */
  frameWidth: 2,         /* bracket arm thickness */
  frameLength: 18,       /* bracket arm length */
  frameEdgeWidth: 3,     /* edge rule thickness */
  frameInset: 0,         /* how far in from the paper edge */
  frameColor: '#DC3E30',
  frameAlpha: 1,
  frameEdgeColor: '',    /* '' → the corner colour */
  frameEdgeAlpha: 1,

  /* folded corner */
  corner: 'fold',        /* none | fold | dogear | curl | torn */
  cornerAt: 'br',        /* tl | tr | bl | br */
  cornerSize: 32,
  curl: '',              /* '' → derived from paper */

  /* tape or pushpin */
  pin: 'none',           /* none | tape | pushpin */
  pinColor: '#f4f1e4',
  pinAlpha: 0.75,

  /* type */
  font: 'hand',          /* hand | sans | condensed | system | serif | mono | marker */
  titleFont: 'inherit',
  titleSize: 34,
  titleWeight: 700,
  titleCase: 'none',     /* none | upper */
  titleTrack: 0,
  titleColor: '',        /* '' → ink */
  titleRule: false,
  taskSize: 26,
  taskLine: 32,
  textShadow: 0,         /* 0..1 dark drop shadow, for legibility over video */
  glow: 0,               /* 0..1 emissive halo, tinted per element */

  /* progress line */
  progressSize: 20,
  progressColor: '',     /* '' -> soft ink */
  progressWeight: 400,

  /* checkbox */
  check: 'square',       /* square | sharp | circle | none */
  checkSize: 22,
  checkStroke: 2,
  checkColor: '',        /* '' → ink */
  checkFillDone: '',     /* '' → stays transparent when checked */
  checkTick: '',         /* '' → checkColor; set it when the box fills in */
  checkTickWidth: 3.2,
  checkTickScale: 1.18,  /* tick size relative to the box; >1 overhangs */
  checkJitter: true,

  /* the item you are on right now — nothing renders until one is marked */
  current: 'bar',        /* none | bar | arrow | dot | highlight */
  currentColor: '',      /* '' → the accent colour */
  currentBold: true,

  /* behaviour */
  /* Striking a task out and fading it are separate decisions — the original
     Asylum skin wanted the strike but not the fade — so they are separate
     tokens rather than one enum of every combination. */
  doneStrike: true,
  doneFade: 'dim',       /* none | dim | mute */
  doneDim: 0.55,
  strikeWidth: 2.5,
  celebrate: true,
  progress: true,
  stampText: 'All done!',
  stampSize: 32,
  stampTrack: 1,
  stampRadius: 8
};

/* Enumerated tokens become data-* attributes; anything not listed here is
   either a scalar/colour written as a custom property, or metadata. */
var ENUMS = {
  texture: 'texture', corner: 'corner', cornerAt: 'corner-at',
  pin: 'pin', font: 'font', titleFont: 'title-font', titleCase: 'title-case',
  check: 'check', doneFade: 'done-fade', shadow: 'shadow', current: 'current'
};

var ENUM_VALUES = {
  texture: ['none', 'ruled', 'grid', 'dots', 'scanlines', 'grain'],
  corner: ['none', 'fold', 'dogear', 'curl', 'torn'],
  cornerAt: ['tl', 'tr', 'bl', 'br'],
  pin: ['none', 'tape', 'pushpin'],
  font: ['hand', 'sans', 'condensed', 'system', 'serif', 'mono', 'marker'],
  titleFont: ['inherit', 'hand', 'sans', 'condensed', 'system', 'serif', 'mono', 'marker'],
  titleCase: ['none', 'upper'],
  check: ['square', 'sharp', 'circle', 'none'],
  current: ['none', 'bar', 'arrow', 'dot', 'highlight'],
  doneFade: ['none', 'dim', 'mute'],
  shadow: ['none', 'soft', 'hard', 'lift']
};

/* Numeric tokens and the range the builder (and a pasted theme) must respect. */
/* Tokens holding a set of flags. Order in the list is canonical, so two themes
   that pick the same corners encode to the same string and compare equal. */
var SET_VALUES = {
  frameCorners: ['tl', 'tr', 'bl', 'br'],
  frameEdges: ['t', 'r', 'b', 'l']
};

var RANGES = {
  paperAngle: [0, 360], paperAlpha: [0, 1], textureAlpha: [0, 1], textureGap: [2, 80],
  inkSoftAlpha: [0, 1], width: [180, 900], radius: [0, 40], tilt: [-15, 15],
  padX: [0, 80], padY: [0, 80], padLeft: [0, 120], padBottom: [0, 80],
  borderWidth: [0, 8],
  borderAlpha: [0, 1], frameAlpha: [0, 1], frameEdgeAlpha: [0, 1],
  frameWidth: [1, 12], frameLength: [4, 200], frameEdgeWidth: [1, 12],
  frameInset: [-20, 40], cornerSize: [0, 90], pinAlpha: [0, 1],
  titleSize: [8, 90], titleWeight: [100, 900], titleTrack: [-2, 10],
  taskSize: [8, 70], taskLine: [8, 90], textShadow: [0, 1], glow: [0, 1],
  progressSize: [8, 48], progressWeight: [100, 900], checkSize: [8, 44],
  checkStroke: [0, 6], checkTickWidth: [0.5, 8], checkTickScale: [0.6, 2.4],
  doneDim: [0.1, 1],
  strikeWidth: [0.5, 8],
  stampSize: [8, 80], stampTrack: [-2, 12], stampRadius: [0, 40]
};

var HEX_RE = /^#[0-9a-fA-F]{6}$/;

function hexToRgb(hex) {
  return [
    parseInt(hex.slice(1, 3), 16),
    parseInt(hex.slice(3, 5), 16),
    parseInt(hex.slice(5, 7), 16)
  ];
}

/* amt < 0 darkens toward black, amt > 0 lightens toward white */
function shade(hex, amt) {
  var c = hexToRgb(hex).map(function (v) {
    v = Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt);
    return Math.max(0, Math.min(255, v));
  });
  return 'rgb(' + c.join(',') + ')';
}

function shadeHex(hex, amt) {
  var c = hexToRgb(hex).map(function (v) {
    v = Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt);
    return Math.max(0, Math.min(255, v));
  });
  return '#' + c.map(function (v) {
    return (v < 16 ? '0' : '') + v.toString(16);
  }).join('');
}

function rgba(hex, a) {
  return 'rgba(' + hexToRgb(hex).join(',') + ',' + a + ')';
}

function clamp(v, lo, hi) {
  return Math.min(hi, Math.max(lo, v));
}

/* Keep only recognised members, drop duplicates, and emit them in the
   canonical order so the same selection always serialises identically. */
function normalizeSet(value, allowed) {
  var seen = {};
  String(value == null ? '' : value).split(/[\s,]+/).forEach(function (k) {
    k = k.toLowerCase();
    if (allowed.indexOf(k) !== -1) seen[k] = 1;
  });
  return allowed.filter(function (k) { return seen[k]; }).join(' ');
}

/* `frame` used to be one enum picking a fixed arrangement. Themes and share
   codes written against it still load: each old value is just a selection the
   new tokens can express, which is why replacing it was the right move. */
var RETIRED_KEYS = { frame: 1 };

var LEGACY_FRAME = {
  'brackets':  { frameCorners: 'tl tr bl br' },
  'rule-left': { frameEdges: 'l', frameEdgeWidth: 3 },
  'inset':     { frameEdges: 't r b l', frameEdgeWidth: 1, frameInset: 5 },
  'none':      {}
};

function migrate(src) {
  if (!src || typeof src !== 'object' || typeof src.frame !== 'string') return src;
  var add = LEGACY_FRAME[src.frame];
  if (!add) return src;
  var out = {};
  Object.keys(src).forEach(function (k) { out[k] = src[k]; });
  Object.keys(add).forEach(function (k) {
    if (out[k] === undefined) out[k] = add[k];
  });
  return out;
}

/* Fill in every missing field and drop anything malformed, so downstream code
   never has to guard. A pasted theme is untrusted input: it comes off someone
   else's clipboard and only the shapes below are honoured. */
function normalize(theme) {
  var out = {};
  var src = migrate((theme && typeof theme === 'object') ? theme : {});

  Object.keys(DEFAULTS).forEach(function (k) {
    var def = DEFAULTS[k];
    var val = src[k];

    if (val === undefined || val === null) { out[k] = def; return; }

    if (SET_VALUES[k]) {
      out[k] = normalizeSet(val, SET_VALUES[k]);
    } else if (ENUM_VALUES[k]) {
      out[k] = ENUM_VALUES[k].indexOf(val) !== -1 ? val : def;
    } else if (typeof def === 'boolean') {
      out[k] = !!val;
    } else if (typeof def === 'number') {
      var n = parseFloat(val);
      if (!isFinite(n)) { out[k] = def; }
      else if (RANGES[k]) { out[k] = clamp(n, RANGES[k][0], RANGES[k][1]); }
      else { out[k] = n; }
    } else if (k === 'id' || k === 'label' || k === 'stampText') {
      out[k] = String(val).slice(0, 60);
    } else {
      /* colour slots: '' is meaningful (means "derive me") */
      out[k] = (val === '' || HEX_RE.test(val)) ? val : def;
    }
  });

  out.v = THEME_V;
  return out;
}

/* Everything a theme implies, resolved: the '' slots filled in from their
   source colour so the CSS never has to fall back. */
function resolve(t) {
  var paper2 = t.paper2 || shadeHex(t.paper, -0.08);
  return {
    paper: t.paperAlpha < 1 ? rgba(t.paper, t.paperAlpha) : t.paper,
    paper2: t.paperAlpha < 1 ? rgba(paper2, t.paperAlpha) : paper2,
    curl: t.curl || shadeHex(t.paper, -0.16),
    ink: t.ink,
    inkSoft: rgba(t.ink, t.inkSoftAlpha),
    titleColor: t.titleColor || t.ink,
    progressColor: t.progressColor || rgba(t.ink, t.inkSoftAlpha),
    checkColor: t.checkColor || t.ink,
    checkFillDone: t.checkFillDone || 'transparent',
    checkTick: t.checkTick || t.checkColor || t.ink,
    currentColor: t.currentColor || t.accent,
    /* 'mute' reuses doneDim as a text alpha rather than an element opacity,
       so a finished task can recede without dimming its checkbox too */
    doneColor: rgba(t.ink, t.doneDim),
    border: rgba(t.borderColor, t.borderAlpha),
    frame: rgba(t.frameColor, t.frameAlpha),
    frameEdge: rgba(t.frameEdgeColor || t.frameColor, t.frameEdgeAlpha),
    pin: rgba(t.pinColor, t.pinAlpha),
    texA: rgba(t.textureColor, t.textureAlpha),
    texB: rgba(t.textureColor2, t.textureAlpha)
  };
}

function shadowOf(strength) {
  if (strength <= 0) return 'none';
  return '0 1px 3px rgba(0,0,0,' + (strength * 0.85).toFixed(2) + ')';
}

/* A halo in the element's own colour, stacked on the legibility shadow so a
   theme can have both. `colour` may already be an rgba() string, so the alpha
   rides on the blur radius instead of the colour. */
function glowOf(strength, colour, shadowStrength) {
  var base = shadowOf(shadowStrength);
  if (strength <= 0) return base;
  var halo = '0 0 ' + (4 + strength * 9).toFixed(1) + 'px ' + colour;
  return base === 'none' ? halo : halo + ', ' + base;
}

/* Where each accent anchors. A corner contributes two layers (one arm each
   way); an edge contributes one running the full side. */
var CORNER_AT = { tl: '0 0', tr: '100% 0', bl: '0 100%', br: '100% 100%' };
var EDGE_AT   = { t: '0 0', r: '100% 0', b: '0 100%', l: '0 0' };

/* The old version hardcoded eight layers in CSS, which is why it could only
   ever draw four corners. Generating the lists means any selection works and
   the three background lists stay aligned by construction. */
function frameLayers(t, c) {
  var img = [], size = [], pos = [];
  var cg = 'linear-gradient(' + c.frame + ',' + c.frame + ')';
  var eg = 'linear-gradient(' + c.frameEdge + ',' + c.frameEdge + ')';

  (t.frameCorners ? t.frameCorners.split(' ') : []).forEach(function (k) {
    if (!CORNER_AT[k]) return;
    img.push(cg); size.push(t.frameLength + 'px ' + t.frameWidth + 'px'); pos.push(CORNER_AT[k]);
    img.push(cg); size.push(t.frameWidth + 'px ' + t.frameLength + 'px'); pos.push(CORNER_AT[k]);
  });

  (t.frameEdges ? t.frameEdges.split(' ') : []).forEach(function (k) {
    if (!EDGE_AT[k]) return;
    img.push(eg);
    size.push(k === 't' || k === 'b'
      ? '100% ' + t.frameEdgeWidth + 'px'
      : t.frameEdgeWidth + 'px 100%');
    pos.push(EDGE_AT[k]);
  });

  if (!img.length) return { img: 'none', size: 'auto', pos: '0 0' };
  return { img: img.join(','), size: size.join(','), pos: pos.join(',') };
}

var SHADOWS = {
  none: 'none',
  soft: '0 8px 18px rgba(0,0,0,.28), 0 2px 4px rgba(0,0,0,.18)',
  hard: '5px 5px 0 rgba(0,0,0,.32)',
  lift: '0 16px 30px rgba(0,0,0,.38), 0 5px 10px rgba(0,0,0,.22)'
};

   properties. Called by both the note and the builder preview. */

  var c = resolve(t);
  var frame = frameLayers(t, c);

  Object.keys(ENUMS).forEach(function (k) {
    note.setAttribute('data-' + ENUMS[k], t[k]);
  });
  note.setAttribute('data-jitter', t.checkJitter ? 'on' : 'off');
  note.setAttribute('data-done-strike', t.doneStrike ? 'on' : 'off');
  note.setAttribute('data-celebrate', t.celebrate ? 'on' : 'off');
  note.setAttribute('data-title-rule', t.titleRule ? 'on' : 'off');

  var vars = {
    '--paper': c.paper,
    '--paper2': c.paper2,
    '--paper-angle': t.paperAngle + 'deg',
    '--ink': c.ink,
    '--ink-soft': c.inkSoft,
    '--accent': t.accent,
    '--curl': c.curl,

    '--note-width': t.width + 'px',
    '--note-radius': t.radius + 'px',
    '--rot': t.tilt + 'deg',
    '--pad-x': t.padX + 'px',
    '--pad-y': t.padY + 'px',
    '--pad-left': (t.padLeft || t.padX) + 'px',
    '--pad-bottom': t.padBottom + 'px',
    '--border-w': t.borderWidth + 'px',
    '--border-c': c.border,
    '--shadow': SHADOWS[t.shadow],

    '--frame-c': c.frame,
    '--frame-img': frame.img,
    '--frame-size': frame.size,
    '--frame-pos': frame.pos,
    '--frame-inset': t.frameInset + 'px',
    '--corner-size': t.cornerSize + 'px',
    '--pin-c': c.pin,

    '--tex-a': c.texA,
    '--tex-b': c.texB,
    '--tex-gap': t.textureGap + 'px',

    '--title-size': t.titleSize + 'px',
    '--title-weight': t.titleWeight,
    '--title-track': t.titleTrack + 'px',
    '--title-c': c.titleColor,
    '--task-size': t.taskSize + 'px',
    '--task-line': t.taskLine + 'px',

       buys legibility over moving video; the halos are decorative and take the
       colour of whatever they sit under, so a title and the progress count can
       glow in their own hues rather than a single shared one. */

    '--title-glow': glowOf(t.glow, c.titleColor, t.textShadow),
    '--progress-glow': glowOf(t.glow, c.progressColor, t.textShadow),

    '--progress-size': t.progressSize + 'px',
    '--progress-c': c.progressColor,
    '--progress-weight': t.progressWeight,

    '--stamp-size': t.stampSize + 'px',
    '--stamp-track': t.stampTrack + 'px',
    '--stamp-radius': t.stampRadius + 'px',

    '--check-size': t.checkSize + 'px',
    '--check-stroke': t.checkStroke + 'px',
    '--check-c': c.checkColor,
    '--check-fill-done': c.checkFillDone,
    '--check-tick': c.checkTick,
    '--check-tick-w': t.checkTickWidth,
    '--check-tick-scale': t.checkTickScale,

    '--current-c': c.currentColor,
    '--current-weight': t.currentBold ? '700' : 'inherit',

    '--done-dim': t.doneDim,
    '--done-c': c.doneColor,
    '--strike-w': t.strikeWidth + 'px'

  Object.keys(vars).forEach(function (k) {
    note.style.setProperty(k, vars[k]);
  });

  return t;
}

/* ---------------------------------------------------------------------------
 * Share codes
 *
 * The builder runs in your desktop browser; the note runs inside OBS's
 * embedded one. They are separate browsers with separate storage, so a theme
 * has to travel as text you can copy into a chat window. Codes carry only what
 * differs from DEFAULTS, which keeps them short and lets a theme made against
 * an older token set still load once new tokens land.
 * ------------------------------------------------------------------------- */

var CODE_PREFIX = 'sn1:';

function toB64(str) {
  return btoa(unescape(encodeURIComponent(str)));
}

function fromB64(b64) {
  return decodeURIComponent(escape(atob(b64)));
}

function encodeTheme(theme) {
  var t = normalize(theme);
  var min = { v: t.v, id: t.id, label: t.label };
  Object.keys(DEFAULTS).forEach(function (k) {
    if (k === 'v' || k === 'id' || k === 'label') return;
    if (t[k] !== DEFAULTS[k]) min[k] = t[k];
  });
  if (theme && theme.swatch) min.swatch = theme.swatch;
  return CODE_PREFIX + toB64(JSON.stringify(min));
}

/* Accepts a share code or raw JSON, so pasting either works. Returns null when
   it isn't a theme at all — the caller says so rather than applying junk. */
function decodeTheme(text) {
  var raw = String(text == null ? '' : text).trim();
  if (!raw) return null;

  var json = raw;
  if (raw.slice(0, CODE_PREFIX.length) === CODE_PREFIX) {
    try { json = fromB64(raw.slice(CODE_PREFIX.length)); }
    catch (e) { return null; }
  }

  var data;
  try { data = JSON.parse(json); } catch (e) { return null; }
  if (!data || typeof data !== 'object' || Array.isArray(data)) return null;

  /* A parsed object of entirely unknown keys is someone's clipboard, not a
     theme; normalize() would happily turn it into the default yellow note.
     Retired keys count as known, so a code written against an older token set
     is still recognisably a theme — migrate() handles it from there. */
  var known = Object.keys(data).filter(function (k) {
    return Object.prototype.hasOwnProperty.call(DEFAULTS, k) || RETIRED_KEYS[k];
  });
  if (!known.length) return null;

  var theme = normalize(data);
  if (data.swatch && HEX_RE.test(data.swatch)) theme.swatch = data.swatch;
  return theme;
}

      { id: uid(), text: 'Finish the character model', done: false },
      { id: uid(), text: 'Answer chat questions', done: false },
      { id: uid(), text: 'Announce next stream', done: false }
    ];
    return s;
  }

  function parseState(raw) {
    var s = defaultState();
    if (!raw) return s;
    try {
      var data = JSON.parse(raw);
      if (!data || typeof data !== 'object') return s;

      if (typeof data.title === 'string') s.title = data.title;
      if (typeof data.size === 'number' && isFinite(data.size)) {
        s.size = Math.min(2, Math.max(0.5, data.size));
      }

      if (Array.isArray(data.themes)) {
        s.themes = data.themes
          .map(function (t) { return normalize(t); })
          .filter(function (t) { return t.id; })
          .slice(0, 40);
      }

      /* Pre-token saves stored `theme: 'yellow' | 'custom'` with the two custom
         colours alongside, and always carried a concrete `rotation` even when
         the user had never touched the slider. Reading that back as an
         override would pin every theme to the old default angle — Asylum, for
         one, is designed flat — so on migration the tilt is deliberately left
         to the theme. A save that already knows about themeId came from this
         version, where a rotation really is a deliberate override. */
      if (typeof data.themeId === 'string') {
        s.themeId = data.themeId;
        if (typeof data.rotation === 'number' && isFinite(data.rotation)) {
          s.rotation = Math.min(15, Math.max(-15, Math.round(data.rotation)));
        }
      } else if (typeof data.theme === 'string') {
        if (data.theme === 'custom') {
          s.themeId = 'yellow';
          if (HEX_RE.test(data.customPaper || '')) s.paper = data.customPaper;
          if (HEX_RE.test(data.customInk || '')) s.ink = data.customInk;
        } else {
          s.themeId = data.theme;
        }
      }
      if (HEX_RE.test(data.paper || '')) s.paper = data.paper;
      if (HEX_RE.test(data.ink || '')) s.ink = data.ink;
      if (typeof data.current === 'string') s.current = data.current;

      if (Array.isArray(data.tasks)) {
        s.tasks = data.tasks
          .filter(function (t) { return t && typeof t.text === 'string'; })
          .map(function (t) {
            return {
              id: typeof t.id === 'string' ? t.id : uid(),
              text: t.text,
              done: !!t.done
            };
          });
      }
      /* a pointer at a task that no longer exists would mark nothing forever */
      if (s.current && !s.tasks.some(function (t) { return t.id === s.current; })) {
        s.current = null;
      }
      return s;
    } catch (e) {
      return s;
    }
  }

  var state;
  var lastRaw = null;
  var prevAllDone = false;

  if (IS_DEMO) {
    state = demoState();
    var demoTheme = qs.get('theme');
    if (demoTheme) state.themeId = demoTheme;
    if (DEMO_MODE === 'all') {
      state.tasks.forEach(function (t) { t.done = true; });
    }
  } else {
    lastRaw = localStorage.getItem(KEY);
    state = parseState(lastRaw);
  }

  function save() {
    if (IS_DEMO) return;
    var raw = JSON.stringify(state);
    try { localStorage.setItem(KEY, raw); } catch (e) { /* storage unavailable */ }
    lastRaw = raw;
  }

  function commit() {
    save();
    render(false);
  }

  /* ---------- Theme resolution ---------- */

  function allThemes() {
    return BUILTINS.concat(state.themes);
  }

  function themeById(id) {
    var all = allThemes();
    for (var i = 0; i < all.length; i++) {
      if (all[i].id === id) return all[i];
    }
    return BUILTINS[0];
  }

  function isBuiltin(id) {
    return BUILTINS.some(function (t) { return t.id === id; });
  }

  /* Base theme with the toolbar's overrides layered on top. */
  function activeTheme() {
    var base = themeById(state.themeId);
    var t = {};
    Object.keys(base).forEach(function (k) { t[k] = base[k]; });
    if (state.rotation !== null) t.tilt = state.rotation;
    if (state.paper) {
      t.paper = state.paper;
      /* the author's derived shades belong to the author's paper, so let them
         be re-derived rather than clashing with a colour they never saw */
      t.paper2 = '';
      t.curl = '';
    }
    if (state.ink) {
      t.ink = state.ink;
      if (!base.titleColor) t.titleColor = '';
      if (!base.checkColor) t.checkColor = '';
    }
    return t;
  }

  /* ---------- Rendering (patches DOM in place so CSS transitions animate) ---------- */

  function buildTask(t) {
    var li = document.createElement('li');
    li.className = 'task' + (t.done ? ' done' : '')
      + (t.id === state.current ? ' current' : '');
    li.dataset.id = t.id;

    var box = document.createElement('button');
    box.className = 'checkbox';
    box.type = 'button';
    box.innerHTML = '<svg viewBox="0 0 26 26"><path class="check" d="M5 14 l6 7 L23 3"/></svg>';
    li.appendChild(box);

    var span = document.createElement('span');
    span.className = 'text';
    var txt = document.createElement('span');
    txt.className = 'txt';
    txt.textContent = t.text;
    span.appendChild(txt);
    li.appendChild(span);

    if (IS_DOCK) {
      box.title = 'Check off';
      box.addEventListener('click', function () { toggleTask(li.dataset.id); });

      txt.setAttribute('contenteditable', 'plaintext-only');
      txt.addEventListener('focus', function () { txt.dataset.orig = txt.textContent; });
      txt.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter') { ev.preventDefault(); txt.blur(); }
        if (ev.key === 'Escape') {
          txt.textContent = txt.dataset.orig || '';
          txt.blur();
        }
      });
      txt.addEventListener('blur', function () {
        var text = txt.textContent.replace(/\s+/g, ' ').trim();
        var task = findTask(li.dataset.id);
        if (!task) return;
        if (!text) { txt.textContent = task.text; return; }
        if (text !== task.text) { task.text = text; commit(); }
        else { txt.textContent = task.text; }
      });

      var controls = document.createElement('span');
      controls.className = 'controls';
      [
        ['◉', 'Mark as the one you are on', function () { setCurrent(li.dataset.id); }],
        ['▲', 'Move up',   function () { moveTask(li.dataset.id, -1); }],
        ['▼', 'Move down', function () { moveTask(li.dataset.id, 1); }],
        ['✕', 'Delete',    function () { removeTask(li.dataset.id); }]
      ].forEach(function (def) {
        var b = document.createElement('button');
        b.type = 'button';
        b.textContent = def[0];
        b.title = def[1];
        b.addEventListener('click', def[2]);
        controls.appendChild(b);
      });
      li.appendChild(controls);
    } else {
      box.tabIndex = -1;
    }
    return li;
  }

  function patchTasks() {
    var existing = {};
    Array.prototype.forEach.call(el.tasks.children, function (li) {
      existing[li.dataset.id] = li;
    });
    var seen = {};
    var prev = null;

    state.tasks.forEach(function (t) {
      var li = existing[t.id];
      if (!li) {
        li = buildTask(t);
      } else {
        li.classList.toggle('done', t.done);
        li.classList.toggle('current', t.id === state.current);
        var txt = li.querySelector('.txt');
        if (document.activeElement !== txt && txt.textContent !== t.text) {
          txt.textContent = t.text;
        }
      }
      seen[t.id] = true;
      var ref = prev ? prev.nextSibling : el.tasks.firstChild;
      if (li !== ref) el.tasks.insertBefore(li, ref);
      prev = li;
    });

    Object.keys(existing).forEach(function (id) {
      if (!seen[id]) existing[id].remove();
    });
  }

  function renderSwatches() {
    var all = allThemes();
    el.swatches.textContent = '';
    all.forEach(function (th) {
      var b = document.createElement('button');
      b.className = 'swatch' + (isBuiltin(th.id) ? '' : ' custom');
      b.type = 'button';
      b.title = th.label + (isBuiltin(th.id) ? '' : ' (yours)');
      b.dataset.theme = th.id;
      b.style.background = th.swatch || th.paper || '#ccc';
      b.addEventListener('click', function () {
        state.themeId = th.id;
        /* a swatch means "this theme as its author made it" */
        state.rotation = null;
        state.paper = null;
        state.ink = null;
        commit();
      });
      el.swatches.appendChild(b);
    });
  }

  function render(initial) {
    var applied = applyTheme(el.note, activeTheme());
    el.note.style.zoom = state.size;

    if (document.activeElement !== el.title && el.title.textContent !== state.title) {
      el.title.textContent = state.title;
    }
    el.stamp.textContent = applied.stampText;

    patchTasks();

    var total = state.tasks.length;
    var done = state.tasks.filter(function (t) { return t.done; }).length;
    el.progress.hidden = total === 0 || !applied.progress;
    el.progress.textContent = done + ' / ' + total + ' done';

    var allDone = total > 0 && done === total;
    el.stamp.hidden = !allDone;
    if (allDone && !prevAllDone && !initial) {
      el.stamp.classList.add('pop');
      el.note.classList.add('celebrate');
      setTimeout(function () {
        el.stamp.classList.remove('pop');
        el.note.classList.remove('celebrate');
      }, 800);
    }
    prevAllDone = allDone;

    if (IS_DOCK) {
      if (el.swatches.children.length !== allThemes().length) renderSwatches();
      Array.prototype.forEach.call(el.swatches.children, function (b) {
        b.classList.toggle('selected', b.dataset.theme === state.themeId);
      });
      var pct = Math.round(state.size * 100);
      if (document.activeElement !== el.sizeSlider) el.sizeSlider.value = pct;
      el.sizeVal.textContent = pct + '%';
      if (document.activeElement !== el.rotSlider) el.rotSlider.value = applied.tilt;
      el.rotVal.textContent = applied.tilt + '°';
      if (document.activeElement !== el.paperColor) el.paperColor.value = applied.paper;
      if (document.activeElement !== el.inkColor) el.inkColor.value = applied.ink;
      el.themeRemove.hidden = isBuiltin(state.themeId);
    }
  }

  /* ---------- Mutations ---------- */

  function findTask(id) {
    for (var i = 0; i < state.tasks.length; i++) {
      if (state.tasks[i].id === id) return state.tasks[i];
    }
    return null;
  }

  function toggleTask(id) {
    var t = findTask(id);
    if (!t) return;
    t.done = !t.done;
    commit();
  }

  function addTask(text) {
    state.tasks.push({ id: uid(), text: text, done: false });
    commit();
  }

  function moveTask(id, delta) {
    var i = state.tasks.map(function (t) { return t.id; }).indexOf(id);
    var j = i + delta;
    if (i < 0 || j < 0 || j >= state.tasks.length) return;
    var tmp = state.tasks[i];
    state.tasks[i] = state.tasks[j];
    state.tasks[j] = tmp;
    commit();
  }

  function removeTask(id) {
    state.tasks = state.tasks.filter(function (t) { return t.id !== id; });
    if (state.current === id) state.current = null;
    commit();
  }

  /* ---------- Commands ----------
   * Everything that drives the list from outside goes through here, and every
   * command is a verb about the list's current state rather than a reference
   * to a particular task. That is deliberate: a button wired to "check off
   * item three" is scrap the moment the list changes, whereas "advance" keeps
   * working for every list you ever write. Bind a key or a Stream Deck button
   * once and never touch it again.
   */

  function firstUnfinished() {
    for (var i = 0; i < state.tasks.length; i++) {
      if (!state.tasks[i].done) return state.tasks[i];
    }
    return null;
  }

  function setCurrent(id) {
    state.current = (state.current === id) ? null : id;
    commit();
  }

  /* Tick off whatever you are on and move to the next thing left. With nothing
     marked yet it just marks where you are, so the first press never skips a
     task by surprise. */
  function advance() {
    if (!state.tasks.length) return;
    var cur = findTask(state.current);
    if (!cur) {
      var start = firstUnfinished();
      state.current = start ? start.id : null;
      commit();
      return;
    }
    cur.done = true;
    var next = firstUnfinished();
    state.current = next ? next.id : null;
    commit();
  }

  /* Step back to the previous task and un-tick it — the undo for a fumbled
     advance, which on a live stream is the button you actually need. */
  function back() {
    var ids = state.tasks.map(function (t) { return t.id; });
    var at = state.current ? ids.indexOf(state.current) : state.tasks.length;
    for (var i = at - 1; i >= 0; i--) {
      if (state.tasks[i].done) {
        state.tasks[i].done = false;
        state.current = state.tasks[i].id;
        commit();
        return;
      }
    }
    if (state.tasks.length) {
      state.current = state.tasks[0].id;
      commit();
    }
  }

  var COMMANDS = {
    advance: advance,
    back: back,
    reset: function () {
      state.tasks.forEach(function (t) { t.done = false; });
      state.current = null;
      commit();
    },
    clear_current: function () {
      state.current = null;
      commit();
    }
  };

  function runCommand(name) {
    var fn = COMMANDS[String(name || '').toLowerCase()];
    if (!fn) return false;
    fn();
    return true;
  }

  /* ---------- Dock-only setup ---------- */

  /* Clipboard access can be refused; falling back to a selection at least lets
     someone hit Ctrl+C without retyping a file path by hand. */
  function selectText(node) {
    var r = document.createRange();
    r.selectNodeContents(node);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(r);
  }

  function flashMsg(text, kind) {
    el.themeMsg.textContent = text;
    el.themeMsg.className = 'theme-msg' + (kind ? ' ' + kind : '');
    if (kind === 'good') {
      setTimeout(function () {
        if (el.themeMsg.textContent === text) el.themeMsg.textContent = '';
      }, 2500);
    }
  }

  /* The builder lives next to this file. Deliberately a copyable path rather
     than a link: a link clicked inside an OBS dock navigates the dock itself,
     which would replace your note with the builder and leave you hunting for
     the way back. Paste it into a real browser instead. */
  function builderPath() {
    var base = location.href.split('#')[0].split('?')[0];
    var cut = base.lastIndexOf('/');
    if (cut === -1) return null;
    return base.slice(0, cut + 1) + 'theme-builder.html';
  }

  function setupBuilderLink() {
    var url = builderPath();
    if (!url) return;

    el.builderUrl.textContent = url;
    el.builderHint.textContent = 'Open this in your normal browser to design a '
      + 'theme, then paste the code it gives you into the box above. It has to '
      + 'be a separate browser: OBS keeps its own, so the builder cannot reach '
      + 'this note directly.';

    el.builderCopy.addEventListener('click', function () {
      var done = function () {
        el.builderCopy.textContent = 'Copied!';
        setTimeout(function () { el.builderCopy.textContent = 'Copy'; }, 1500);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(done, function () {
          selectText(el.builderUrl);
        });
      } else {
        selectText(el.builderUrl);
      }
    });

    el.themeBuilder.hidden = false;
  }

  function setupThemePanel() {
    el.themeBtn.addEventListener('click', function () {
      el.themePanel.hidden = !el.themePanel.hidden;
      if (!el.themePanel.hidden) el.themeCode.focus();
    });

    el.themeApply.addEventListener('click', function () {
      var theme = decodeTheme(el.themeCode.value);
      if (!theme) {
        flashMsg('That is not a theme code.', 'bad');
        return;
      }
      /* Ids collide easily — two people both start from "Classic Yellow" in
         the builder. Keep the incoming label but give it a fresh id unless it
         is genuinely replacing one of your own. */
      if (isBuiltin(theme.id)) theme.id = theme.id + '-' + uid().slice(0, 4);
      var at = -1;
      state.themes.forEach(function (t, i) { if (t.id === theme.id) at = i; });
      if (at >= 0) state.themes[at] = theme; else state.themes.push(theme);

      state.themeId = theme.id;
      state.rotation = null;
      state.paper = null;
      state.ink = null;
      el.themeCode.value = '';
      renderSwatches();
      commit();
      flashMsg('Added "' + theme.label + '".', 'good');
    });

    el.themeCopy.addEventListener('click', function () {
      var t = activeTheme();
      var base = themeById(state.themeId);
      t.label = base.label + (isBuiltin(state.themeId) ? ' (edited)' : '');
      var code = encodeTheme(t);
      el.themeCode.value = code;
      el.themeCode.select();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(code).then(
          function () { flashMsg('Copied.', 'good'); },
          function () { flashMsg('Select the box and copy.', null); }
        );
      } else {
        flashMsg('Select the box and copy.', null);
      }
    });

    el.themeRemove.addEventListener('click', function () {
      if (isBuiltin(state.themeId)) return;
      var gone = state.themeId;
      state.themes = state.themes.filter(function (t) { return t.id !== gone; });
      state.themeId = 'yellow';
      renderSwatches();
      commit();
      flashMsg('Removed.', 'good');
    });
  }

  function setupDock() {
    el.toolbar.hidden = false;
    el.addRow.hidden = false;

    renderSwatches();
    setupThemePanel();
    setupBuilderLink();

    el.sizeSlider.addEventListener('input', function () {
      state.size = el.sizeSlider.value / 100;
      commit();
    });
    el.rotSlider.addEventListener('input', function () {
      state.rotation = parseInt(el.rotSlider.value, 10);
      commit();
    });
    el.paperColor.addEventListener('input', function () {
      state.paper = el.paperColor.value;
      commit();
    });
    el.inkColor.addEventListener('input', function () {
      state.ink = el.inkColor.value;
      commit();
    });

    el.title.setAttribute('contenteditable', 'plaintext-only');
    el.title.addEventListener('focus', function () { el.title.dataset.orig = el.title.textContent; });
    el.title.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') { ev.preventDefault(); el.title.blur(); }
      if (ev.key === 'Escape') {
        el.title.textContent = el.title.dataset.orig || DEFAULT_TITLE;
        el.title.blur();
      }
    });
    el.title.addEventListener('blur', function () {
      var text = el.title.textContent.replace(/\s+/g, ' ').trim();
      if (!text) { el.title.textContent = state.title; return; }
      if (text !== state.title) { state.title = text; commit(); }
    });

    el.addInput.addEventListener('keydown', function (ev) {
      if (ev.key !== 'Enter') return;
      var text = el.addInput.value.replace(/\s+/g, ' ').trim();
      if (!text) return;
      el.addInput.value = '';
      addTask(text);
      el.addInput.focus();
    });

    el.uncheckAll.addEventListener('click', function () {
      state.tasks.forEach(function (t) { t.done = false; });
      commit();
    });

    var clearTimer = 0;
    el.clearList.addEventListener('click', function () {
      if (!clearTimer) {
        el.clearList.textContent = 'Really clear?';
        el.clearList.classList.add('armed');
        clearTimer = setTimeout(function () {
          clearTimer = 0;
          el.clearList.textContent = 'Clear list';
          el.clearList.classList.remove('armed');
        }, 3000);
      } else {
        clearTimeout(clearTimer);
        clearTimer = 0;
        el.clearList.textContent = 'Clear list';
        el.clearList.classList.remove('armed');
        state.tasks = [];
        commit();
      }
    });
  }

  /* ---------- Setup-URLs panel ---------- */

  function setupUrlPanel() {
    var inOBS = !!window.obsstudio;
    if (!IS_DOCK && inOBS) return; // on-stream overlay: never show

    var panel = document.getElementById('setup');
    var base = location.href.split('#')[0].split('?')[0];

    var title = document.createElement('div');
    title.className = 'setup-title';
    title.textContent = IS_DOCK
      ? 'This note lives at these URLs. If you move the file, update them in OBS:'
      : 'Add this sticky note to OBS:';
    panel.appendChild(title);

    [['Dock', base + '?view=dock'], ['Overlay', base]].forEach(function (pair) {
      var row = document.createElement('div');
      row.className = 'url-row';
      var lab = document.createElement('span');
      lab.className = 'url-label';
      lab.textContent = pair[0];
      var txt = document.createElement('span');
      txt.className = 'url-text';
      txt.textContent = pair[1];
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'copy-btn';
      btn.textContent = 'Copy';
      btn.addEventListener('click', function () {
        var done = function () {
          btn.textContent = 'Copied!';
          setTimeout(function () { btn.textContent = 'Copy'; }, 1500);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(pair[1]).then(done, function () { selectText(txt); });
        } else {
          selectText(txt);
        }
      });
      row.appendChild(lab);
      row.appendChild(txt);
      row.appendChild(btn);
      panel.appendChild(row);
    });

    var hint = document.createElement('div');
    hint.className = 'setup-hint';
    hint.textContent = 'Dock URL goes in View → Docks → Custom Browser Docks. '
      + 'Overlay URL goes in a Browser source with “Local file” unchecked.';
    panel.appendChild(hint);

    panel.hidden = false;
  }

  /* ---------- Ways to run a command ----------
   * Three transports, one command set. The commands stay verbs so a binding
   * made once survives every list you write afterwards.
   */

  /* 1. The keyboard, in the dock. Free, works today, no setup. */
  function setupKeys() {
    document.addEventListener('keydown', function (ev) {
      if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
      /* never while a task, the title, or the add box is being typed into */
      var a = document.activeElement;
      if (a && (a.isContentEditable || a.tagName === 'INPUT'
                || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT')) return;

      if (ev.key === ' ' || ev.key === 'Enter') { ev.preventDefault(); runCommand('advance'); }
      else if (ev.key === 'Backspace') { ev.preventDefault(); runCommand('back'); }
    });
  }

  /* 2. OBS custom events, which is how anything outside OBS reaches this page.
   *    obs-websocket's CallVendorRequest with vendorName "obs-browser" and
   *    requestType "emit_event" dispatches a DOM event into browser sources,
   *    so a Stream Deck, a Companion button or a script can drive the list
   *    without knowing anything about what is on it.
   *
   *    Listened for in both the overlay and the dock: whichever receives it
   *    writes to storage, and the other picks the change up on its next poll.
   */
  function setupObsEvents() {
    ['sticky-note', 'obs-sticky-note'].forEach(function (name) {
      window.addEventListener(name, function (ev) {
        var d = ev && ev.detail;
        var cmd = d && (typeof d === 'string' ? d : d.command || d.cmd);
        runCommand(cmd);
      });
    });
    /* one event per command too, so a sender that cannot attach a payload
       still has something to aim at */
    Object.keys(COMMANDS).forEach(function (cmd) {
      window.addEventListener('sticky-note-' + cmd.replace(/_/g, '-'), function () {
        runCommand(cmd);
      });
    });
  }

  /* 3. A URL parameter, for a hidden browser source used as a command channel:
   *    point one at ?cmd=advance and have a hotkey refresh it. Clumsy, but it
   *    needs no websocket and no extra software. It runs once on load and only
   *    ever writes — it never renders anything.
   */
  function runUrlCommand() {
    var cmd = qs.get('cmd');
    if (!cmd || IS_DEMO) return false;
    return runCommand(cmd);
  }

  /* ---------- Sync (storage event + polling fallback) ---------- */

  function refreshFromStorage() {
    var raw = localStorage.getItem(KEY);
    if (raw === lastRaw) return;
    lastRaw = raw;
    state = parseState(raw);
    if (IS_DOCK) renderSwatches();
    render(false);
  }

  /* ---------- Init ---------- */

  document.body.classList.add(IS_DOCK ? 'dock' : 'overlay');
  document.title = IS_DOCK ? 'Sticky Note (Dock)' : 'Sticky Note';
  if (SCALE && SCALE !== 1 && SCALE > 0.2 && SCALE <= 5) {
    document.body.style.zoom = SCALE;
  }

  if (IS_DOCK) {
    setupDock();
    setupKeys();
  }
  setupObsEvents();
  setupUrlPanel();

  if (!IS_DEMO) {
    window.addEventListener('storage', function (ev) {
      if (ev.key === KEY || ev.key === null) refreshFromStorage();
    });
    setInterval(refreshFromStorage, 1000);
  }

  runUrlCommand();
  render(true);
})();
</script>
</body>
</html>
